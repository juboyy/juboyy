<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="16">
  <style>
    text { fill: #e5e5e5; letter-spacing: 0.5px; }
    .dim { fill: #525252; }
    .hot { fill: #ef4444; }
    .warm { fill: #f97316; }
    .cool { fill: #eab308; }
    .cyan { fill: #22d3ee; }
  </style>

  <rect width="900" height="320" fill="#0a0a0a"/>

  <!-- ============ Banner ASCII "JOAO SOARES" que pulsa opacity ============ -->
  <g transform="translate(30, 40)">
    <text x="0" y="0" class="warm">
      ╔══════════════════════════════════════════════════════════════════╗
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="22">
      <tspan class="warm">║</tspan>  <tspan class="hot">▓▓</tspan>  <tspan>engenheiro autodidata</tspan>   <tspan class="dim">·</tspan>   <tspan>fundador aumi group</tspan>  <tspan class="warm">║</tspan>
    </text>
    <text x="0" y="44">
      <tspan class="warm">║</tspan>  <tspan class="hot">▓▓</tspan>  <tspan>sistemas de ia em produção</tspan>   <tspan class="dim">·</tspan>   <tspan>fintech · enterprise</tspan>  <tspan class="warm">║</tspan>
    </text>
    <text x="0" y="66" class="warm">
      ╚══════════════════════════════════════════════════════════════════╝
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ============ Wave ASCII (braille) que ROLA da esquerda pra direita ============ -->
  <!-- 3 waves com fases diferentes pra dar profundidade -->
  <g transform="translate(30, 145)">
    <!-- wave 1: braille denso -->
    <text x="0" y="0" class="hot">
      <tspan>⡀</tspan><tspan>⣀</tspan><tspan>⣤</tspan><tspan>⣶</tspan><tspan>⣿</tspan><tspan>⣶</tspan><tspan>⣤</tspan><tspan>⣀</tspan><tspan>⡀</tspan><tspan> </tspan><tspan>⡀</tspan><tspan>⣀</tspan><tspan>⣤</tspan><tspan>⣶</tspan><tspan>⣿</tspan><tspan>⣶</tspan><tspan>⣤</tspan><tspan>⣀</tspan><tspan>⡀</tspan><tspan> </tspan><tspan>⡀</tspan><tspan>⣀</tspan><tspan>⣤</tspan><tspan>⣶</tspan><tspan>⣿</tspan><tspan>⣶</tspan><tspan>⣤</tspan><tspan>⣀</tspan><tspan>⡀</tspan><tspan> </tspan><tspan>⡀</tspan><tspan>⣀</tspan><tspan>⣤</tspan><tspan>⣶</tspan><tspan>⣿</tspan><tspan>⣶</tspan><tspan>⣤</tspan><tspan>⣀</tspan><tspan>⡀</tspan><tspan> </tspan><tspan>⡀</tspan><tspan>⣀</tspan><tspan>⣤</tspan><tspan>⣶</tspan><tspan>⣿</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 0; -240 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(30, 175)">
    <text x="0" y="0" class="warm">
      <tspan>─</tspan><tspan>─</tspan><tspan>╮</tspan><tspan> </tspan><tspan> </tspan><tspan>╭</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╮</tspan><tspan> </tspan><tspan> </tspan><tspan>╭</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╮</tspan><tspan> </tspan><tspan> </tspan><tspan>╭</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╮</tspan><tspan> </tspan><tspan> </tspan><tspan>╭</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╮</tspan><tspan> </tspan><tspan> </tspan><tspan>╭</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╮</tspan><tspan> </tspan><tspan> </tspan><tspan>╭</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╮</tspan><tspan> </tspan><tspan> </tspan><tspan>╭</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╮</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 0; -140 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(30, 195)">
    <text x="0" y="0" class="cool">
      <tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan>╰</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╯</tspan><tspan> </tspan><tspan> </tspan><tspan>╰</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╯</tspan><tspan> </tspan><tspan> </tspan><tspan>╰</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╯</tspan><tspan> </tspan><tspan> </tspan><tspan>╰</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╯</tspan><tspan> </tspan><tspan> </tspan><tspan>╰</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╯</tspan><tspan> </tspan><tspan> </tspan><tspan>╰</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╯</tspan><tspan> </tspan><tspan> </tspan><tspan>╰</tspan><tspan>─</tspan><tspan>─</tspan><tspan>╯</tspan><tspan> </tspan><tspan> </tspan><tspan>╰</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 0; -140 0; 0 0" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ============ Matrix rain (colunas de chars caindo) ============ -->
  <g transform="translate(0, 235)">
    <!-- 20 colunas verticais, cada uma com chars trocando em ciclo -->
    <text x="45"  y="0" class="cool" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>0</text>
    <text x="80"  y="0" class="warm" opacity="0.7"><animate attributeName="y" values="-20;60" dur="1.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>1</text>
    <text x="115" y="0" class="hot"  opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>█</text>
    <text x="150" y="0" class="cool" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.7s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>▓</text>
    <text x="185" y="0" class="warm" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.0s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.0s" begin="0.2s" repeatCount="indefinite"/>▒</text>
    <text x="220" y="0" class="cyan" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.4s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>░</text>
    <text x="255" y="0" class="cool" opacity="0.7"><animate attributeName="y" values="-20;60" dur="1.7s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.7s" begin="1.1s" repeatCount="indefinite"/>1</text>
    <text x="290" y="0" class="hot"  opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>0</text>
    <text x="325" y="0" class="warm" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.1s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0.8s" repeatCount="indefinite"/>█</text>
    <text x="360" y="0" class="cool" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.3s" begin="0.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="0.1s" repeatCount="indefinite"/>▓</text>
    <text x="395" y="0" class="cyan" opacity="0.7"><animate attributeName="y" values="-20;60" dur="1.9s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0.7s" repeatCount="indefinite"/>▒</text>
    <text x="430" y="0" class="warm" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.5s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.0s" repeatCount="indefinite"/>░</text>
    <text x="465" y="0" class="cool" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.2s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>1</text>
    <text x="500" y="0" class="hot"  opacity="0.7"><animate attributeName="y" values="-20;60" dur="1.8s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>0</text>
    <text x="535" y="0" class="warm" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>█</text>
    <text x="570" y="0" class="cool" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.7s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="0.2s" repeatCount="indefinite"/>▓</text>
    <text x="605" y="0" class="cyan" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.0s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.0s" begin="0.8s" repeatCount="indefinite"/>▒</text>
    <text x="640" y="0" class="warm" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.6s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>░</text>
    <text x="675" y="0" class="cool" opacity="0.7"><animate attributeName="y" values="-20;60" dur="1.7s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.7s" begin="1.1s" repeatCount="indefinite"/>1</text>
    <text x="710" y="0" class="hot"  opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="0.4s" repeatCount="indefinite"/>0</text>
    <text x="745" y="0" class="warm" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.1s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0.7s" repeatCount="indefinite"/>█</text>
    <text x="780" y="0" class="cool" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.5s" begin="0.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.1s" repeatCount="indefinite"/>▓</text>
    <text x="815" y="0" class="cyan" opacity="0.7"><animate attributeName="y" values="-20;60" dur="1.9s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="1.0s" repeatCount="indefinite"/>▒</text>
    <text x="850" y="0" class="warm" opacity="0.7"><animate attributeName="y" values="-20;60" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>░</text>
  </g>
</svg>
